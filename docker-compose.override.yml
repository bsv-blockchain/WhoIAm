# Development overrides — hot reload, debug ports, dev tools
# Usage: docker compose up (automatically applies this override)
# For production: docker compose -f docker-compose.yml up

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-dev_password_change_me}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_password_change_me}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    command: npx tsx --watch src/index.ts
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src:/app/src:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      SERVER_PRIVATE_KEY: ${SERVER_PRIVATE_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_SERVICE_SID: ${TWILIO_SERVICE_SID}
      X_CLIENT_ID: ${X_CLIENT_ID}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_password_change_me}@redis:6379
      

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    command: npx vite --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro

    environment:
      NODE_ENV: development
      VITE_API_TARGET: http://backend:8080

volumes:
  redis-data:
    driver: local