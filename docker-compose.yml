services:
  # ─── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-dev_password_change_me}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_password_change_me}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Backend API ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      secrets:
        - github_token
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_password_change_me}@redis:6379
      HTTP_PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      X_REDIRECT_URI: ${X_REDIRECT_URI:-http://localhost:8080/api/verify/x/callback}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/verify/google/callback}
      # Mobile wallet relay — RELAY_PUBLIC_URL must be reachable from the phone
      # (use an ngrok tunnel to this backend in local dev).
      RELAY_ENABLED: ${RELAY_ENABLED:-true}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-http://localhost:8080}
      RELAY_WS_URL: ${RELAY_WS_URL:-ws://localhost:8080}
      QR_SCHEMA: ${QR_SCHEMA:-bsv-wallet}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Frontend (Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_FRONT_URL: ${VITE_FRONT_URL:-http://localhost:3000}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
      VITE_BSV_NETWORK: ${VITE_BSV_NETWORK:-mainnet}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Monitoring (profile: monitoring) ──────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

secrets:
  # Build-time only: a token with read:packages, used to install the private
  # @bsv-blockchain-demos/float-balance-route from GitHub Packages during the
  # backend image build. Export it before building, e.g.
  #   GITHUB_TOKEN=$(gh auth token) docker compose up --build
  github_token:
    environment: GITHUB_TOKEN
